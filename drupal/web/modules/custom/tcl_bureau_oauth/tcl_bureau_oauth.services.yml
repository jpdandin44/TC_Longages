services:
  tcl_bureau_oauth.connection:
    class: Drupal\tcl_bureau_oauth\BureauOAuth
    arguments: ['@request_stack', '@http_client', '@entity_type.manager', '@current_user']
  tcl_bureau_oauth.guard:
    class: Drupal\tcl_bureau_oauth\EventSubscriber\BureauOAuthGuard
    arguments: ['@tcl_bureau_oauth.connection']
    tags:
      - { name: event_subscriber }
