tcl_bureau.members:
  path: '/bureau/membres'
  defaults:
    _controller: '\Drupal\tcl_bureau\Controller\BureauController::members'
    _title: 'Adhérents — En construction'
  requirements:
    _custom_access: '\Drupal\tcl_bureau\Controller\BureauController::access'

tcl_bureau.teams:
  path: '/bureau/equipes'
  defaults:
    _controller: '\Drupal\tcl_bureau\Controller\BureauController::teams'
    _title: 'Équipes du club'
  requirements:
    _custom_access: '\Drupal\tcl_bureau\Controller\BureauController::access'

tcl_bureau.responses:
  path: '/bureau/reponses'
  defaults:
    _controller: '\Drupal\tcl_bureau\Controller\WorkspaceReportsController::responses'
    _title: 'Suivi des réponses'
