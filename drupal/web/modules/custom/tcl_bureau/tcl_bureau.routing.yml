tcl_bureau.google_calendar:
  path: '/bureau/agenda-google'
  defaults:
    _form: '\Drupal\tcl_bureau\Form\GoogleCalendarForm'
    _title: 'Google Agenda de recette'
  requirements:
    _custom_access: '\Drupal\tcl_bureau\Controller\GoogleContactsController::access'

