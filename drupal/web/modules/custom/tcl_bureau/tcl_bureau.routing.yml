tcl_bureau.delivery_history_recipe:
  path: '/bureau/historique-envois'
  defaults:
    _controller: '\Drupal\tcl_bureau\Controller\ClubFollowupController::view'
  requirements:
    _custom_access: '\Drupal\tcl_bureau\Controller\ClubFollowupController::access'
