name: CI — TC Longages

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  beta-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, mbstring, intl, gd, zip, sodium, openssl
          coverage: none
          tools: composer:2.10.3
      - name: Verifier les sources figees du candidat beta
        run: python3 scripts/verify_beta_release.py verify
      - name: Installer et auditer le verrou beta dans une copie jetable
        env:
          COMPOSER_ROOT_VERSION: dev-beta-security
        run: |
          set -euo pipefail
          mkdir -p .local/beta-ci
          cp -a config/launch-beta/source/drupal/. .local/beta-ci/
          composer --working-dir=.local/beta-ci install --no-dev --prefer-dist --no-progress --no-interaction --no-scripts
          composer --working-dir=.local/beta-ci --no-plugins --no-scripts audit --locked --no-dev
          php -r 'require ".local/beta-ci/vendor/autoload.php"; if (Drupal::VERSION !== "11.4.10") { exit(1); } echo Drupal::VERSION, PHP_EOL;'
          python3 scripts/verify_beta_release.py verify
  bureau-oauth-runtime:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, mbstring, intl, gd, zip, sodium, openssl
          coverage: none
          tools: composer:2.10.3
      - name: Vérifier OAuth et le Bureau avec des identités fictives locales
        run: |
          $env:PATH = 'C:\Program Files\Git\bin;' + $env:PATH
          ./scripts/bureau-oauth-recette.ps1 -Prepare
  delivery-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Vérifier archives, reçus et limites de première installation
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Vérifier la syntaxe PHP propre au site
        run: |
          set -euo pipefail
          find drupal/web/modules/custom drupal/config drupal/bin scripts tests -type f \( -name '*.php' -o -name '*.install' -o -name '*.module' \) -print0 | xargs -0 -r -n1 php -l
  drupal-mysql:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
      - name: Préparer PHP et Composer pour la recette Drupal native
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2, commit vérifié
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring, intl, gd, zip, sodium
          coverage: none
          tools: composer:2.10.3
      - name: Préparer uniquement le checkout jetable du runner
        run: |
          npm.cmd ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run officiel:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/drupal-local.ps1 prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PHPRC = (Resolve-Path '.local/drupal-tools/php.ini').Path
          composer install --working-dir=drupal --no-interaction --prefer-dist --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Vérifier installation additive, mise à jour et restauration MariaDB
        run: |
          ./scripts/drupal-mysql-recette.ps1 -PhpPath (Get-Command php.exe).Source
      - name: Montrer uniquement le diagnostic nettoyé en cas d'échec
        if: failure()
        run: |
          if (Test-Path '.local/mysql-recette/test-error.log') {
            Get-Content '.local/mysql-recette/test-error.log' -Tail 60
          }
  support-runtime:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'
      - name: Préparer PHP et Composer du runtime de recette
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2, commit réutilisé du lot V2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, mbstring, intl, gd, zip, sodium
          coverage: none
          tools: composer:2.10.3
      - name: Recetter le support dans le seul checkout jetable du runner
        run: |
          $ErrorActionPreference = 'Stop'
          npm.cmd ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run officiel:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/drupal-local.ps1 -Action prepare -Port 4183
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = 'C:\Program Files\Git\bin;' + $env:PATH
          ./scripts/drupal-local.ps1 -Action install -Port 4183
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          php -c .local/drupal-tools/php.ini drupal/bin/configure-support-local.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          php -c .local/drupal-tools/php.ini tests/support-runtime.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            ./scripts/drupal-local.ps1 -Action start -Port 4183
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tests/test_support_http.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            ./scripts/drupal-local.ps1 -Action stop -Port 4183
          }
  technical-ci:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Lire le candidat sans conserver de droit Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Préparer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Préparer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'
      - name: Installer les dépendances de contrôle
        run: |
          npm.cmd ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .local/framework-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.local/framework-venv/Scripts/python.exe -m pip install -r docs/references/framework-developpement-pilote/requirements-verification.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Construire et tester toutes les variantes du site
        run: npm.cmd run check
      - name: Régénérer les vues de lecture dans le seul checkout de CI
        run: npm.cmd run framework:build
      - name: Vérifier le framework sans accorder de validation humaine
        run: npm.cmd run framework:check
      - name: Vérifier les sources du candidat après construction
        run: |
          if (Test-Path -LiteralPath 'data/framework-candidate.json') {
            node scripts/framework-candidate.mjs verify
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Output '::notice::Manifeste absent : preuve du candidat à préparer. Aucune vérification du candidat attestée pour ce premier bootstrap.'
          }
